name: TOPIS 소통정보 수집

# 한국시간(KST = UTC+9) 16:00 ~ 23:00, 매시 정각과 30분에 실행 (하루 15회)
#   07:00~13:30 UTC = 16:00~22:30 KST (정각/30분)
#   14:00 UTC      = 23:00 KST (마지막 회차)
on:
  schedule:
    - cron: '0,30 7-13 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

# 앞선 회차가 push를 마칠 때까지 기다린다 (커밋 충돌 방지)
concurrency:
  group: topis-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 소통정보 수집
        run: python collect_topis.py

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 생략"
            exit 0
          fi
          git commit -m "data: TOPIS 소통정보 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push 재시도 $i"
            sleep 5
          done
          exit 1
