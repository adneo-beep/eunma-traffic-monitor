name: TOPIS 소통정보 수집

# 실제 5분 간격 수집은 외부 크론 서비스(cron-job.org)가 workflow_dispatch API를
# 직접 호출해서 담당한다. GitHub의 자체 schedule 트리거는 5분처럼 짧은 주기에서
# 수십 분씩 지연되거나 실행이 누락되는 경우가 있어 신뢰할 수 없기 때문이다
# (실행 이력으로 확인됨: 2026-08-01~04 동안 20~90분씩 불규칙하게 지연).
#
# 아래 schedule은 외부 크론이 멈췄을 때를 위한 안전망으로, 정시(매시 0분)에만
# 한 번씩 최소한으로 돈다. 한국시간(KST = UTC+9) 16:00 ~ 23:30.
#   07:00~14:00 UTC = 16:00~23:00 KST (매시 정각)
#   14:30 UTC       = 23:30 KST (학원 파장 정체 해소 확인용 마지막 회차)
on:
  schedule:
    - cron: '0 7-14 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:

# 앞선 회차가 push를 마칠 때까지 기다린다 (커밋 충돌 방지)
concurrency:
  group: topis-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 소통정보 수집
        run: python collect_topis.py

      # 대조군은 부가 관측이므로 실패해도 본 수집 결과를 버리지 않는다.
      - name: 대조군 수집
        continue-on-error: true
        run: python collect_control.py

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 생략"
            exit 0
          fi
          git commit -m "data: TOPIS 소통정보 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push 재시도 $i"
            sleep 5
          done
          exit 1
